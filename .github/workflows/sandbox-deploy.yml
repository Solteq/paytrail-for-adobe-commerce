name: Sandbox Deploy

on:
  push:
    branches:
      - staging
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger paytrail-sandbox update
        env:
          GH_TOKEN: ${{ secrets.SANDBOX_REPO_TOKEN }}
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            https://api.github.com/repos/Solteq/paytrail-sandbox/dispatches \
            -d '{"event_type":"paytrail-staging-updated"}'
