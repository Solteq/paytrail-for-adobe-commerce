name: Run MFTF Tests

on:
    push:
        branches: [ staging ]
    pull_request:

jobs:
    mftf:
        runs-on: ubuntu-latest

        services:
            redis:
                image: redis:7.2-alpine
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 3
            rabbitmq:
                image: rabbitmq:3-management
                ports:
                    - 5672:5672
                    - 15672:15672
                env:
                    RABBITMQ_DEFAULT_USER: user
                    RABBITMQ_DEFAULT_PASS: password
                options: >-
                    --health-cmd "rabbitmq-diagnostics -q check_running"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 3
            opensearch:
                image: opensearchproject/opensearch:2.10.0
                ports:
                    - 9200:9200
                env:
                    discovery.type: single-node
                    plugins.security.disabled: "true"
                options: >-
                    --health-cmd "curl -k -s -f http://localhost:9200/_cluster/health"
                    --health-interval 20s
                    --health-timeout 5s
                    --health-retries 5
            mysql:
                image: mariadb:10.6
                ports:
                    - 3306:3306
                env:
                    MYSQL_ROOT_PASSWORD: root
                    MYSQL_DATABASE: magento
                    MYSQL_USER: magento
                    MYSQL_PASSWORD: magento
                options: >-
                    --health-cmd "mysqladmin ping -h localhost"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 3

        steps:
            -   name: Checkout repository
                uses: actions/checkout@v4

            -   name: Set up PHP 8.2
                uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.2'
                    extensions: mbstring, intl, soap, mysqli, dom, simplexml, xsl, zip, bcmath, gd
                    ini-values: memory_limit=2G

            -   name: Install Composer
                run: sudo apt-get update && sudo apt-get install -y composer

            -   name: Install Chromium & ChromeDriver
                run: |
                    sudo apt-get update
                    sudo apt-get install -y chromium-browser chromium-chromedriver
                    chromium-browser --version
                    chromedriver --version

            -   name: Install Magento 2.4.8
                env:
                    COMPOSER_AUTH: |
                        {
                          "http-basic": {
                            "repo.magento.com": {
                              "username": "${{ secrets.REPO_MAGENTO_USER }}",
                              "password": "${{ secrets.REPO_MAGENTO_PASSWORD }}"
                            }
                          }
                        }
                run: |
                    composer create-project --repository-url=https://repo.magento.com/ magento/project-community-edition magento
                    cd magento
                    php -d memory_limit=1G bin/magento setup:install \
                      --base-url=http://127.0.0.1:8000 \
                      --db-host=127.0.0.1 \
                      --db-name=magento \
                      --db-user=magento \
                      --db-password=magento \
                      --admin-firstname=Admin \
                      --admin-lastname=User \
                      --admin-email=admin@example.com \
                      --admin-user=admin \
                      --admin-password=admin123 \
                      --backend-frontname=admin \
                      --language=en_US \
                      --currency=USD \
                      --timezone=America/New_York \
                      --use-rewrites=1 \
                      --search-engine=opensearch \
                      --opensearch-host=localhost \
                      --opensearch-port=9200 \
                      --opensearch-index-prefix=magento2 \
                      --opensearch-enable-auth=0 \
                      --cache-backend=redis \
                      --cache-backend-redis-server=localhost \
                      --cache-backend-redis-port=6379 \
                      --page-cache=redis \
                      --page-cache-redis-server=localhost \
                      --page-cache-redis-port=6379 \
                      --session-save=redis \
                      --session-save-redis-host=localhost \
                      --session-save-redis-port=6379 \
                      --amqp-host=localhost \
                      --amqp-port=5672 \
                      --amqp-user=user \
                      --amqp-password=password
            -   name: Install Paytrail module
                run: |
                    cd magento
                    composer require paytrail/paytrail-php-sdk
                    mkdir -p app/code/Paytrail/PaymentService
                    rsync -av --exclude='.git' --exclude='vendor' --exclude='app/autoload.php' --exclude='magento' ../ ./app/code/Paytrail/PaymentService/
                    bin/magento module:enable Paytrail_PaymentService
                    bin/magento setup:upgrade
                    bin/magento setup:di:compile
                    bin/magento setup:static-content:deploy -f

            -   name: Install MFTF
                run: |
                    cd magento
                    composer require --dev magento/magento-functional-testing-framework:^3.10
                    vendor/bin/mftf build:project
                    # configure MFTF env
                    cat <<EOF > dev/tests/acceptance/.env
                    MAGENTO_BASE_URL=http://127.0.0.1:8080/
                    MAGENTO_BACKEND_NAME=admin
                    MAGENTO_ADMIN_USERNAME=admin
                    MAGENTO_ADMIN_PASSWORD=Admin123
                    SELENIUM_HOST=127.0.0.1
                    SELENIUM_PORT=4444
                    BROWSER=chrome
                    ENABLE_SELENIUM=1
                    EOF

            -   name: Start PHP built-in webserver
                run: |
                    cd magento
                    nohup php -S 127.0.0.1:8080 -t pub/ > server.log 2>&1 &

            -   name: Start Selenium with Chrome
                run: |
                    wget https://selenium-release.storage.googleapis.com/3.141/selenium-server-standalone-3.141.59.jar
                    nohup java -jar selenium-server-standalone-3.141.59.jar -port 4444 > selenium.log 2>&1 &

            -   name: Run MFTF Tests
                run: |
                    cd magento
                    vendor/bin/mftf run:group Paytrail --remove --debug

            -   name: Upload MFTF Logs
                if: failure()
                uses: actions/upload-artifact@v4
                with:
                    name: mftf-logs
                    path: magento/dev/tests/acceptance/tests/_output
